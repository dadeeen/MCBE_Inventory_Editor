name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-Privilege: packages:write bekommt nur der docker-publish-Job.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  typecheck:
    name: Typed core check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
      - name: Mypy typed core
        run: python -m mypy

  integrity:
    name: Dependency and lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
      - name: Python dependency integrity
        run: python -m pip check
      - name: Validate hash-locked dependency files
        run: |
          python scripts/compile_lockfiles.py --check
          python scripts/check_lockfiles.py
      - name: Dependency audit
        run: python scripts/security_check.py --require-pip-audit

  tests:
    name: Python ${{ matrix.python }} tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
      - name: Verify application environment has no native references
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('leveldb', 'amulet_nbt', 'numpy', 'Cython'))"
      - name: Smoke checks
        run: MCBE_SMOKE_IMPORT_APP=true python scripts/smoke_check.py
      - name: Tests
        run: python scripts/test_full.py -v
      - name: Backend branch coverage
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/coverage_check.py -q
      - name: Upload coverage report
        if: always() && matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore

  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser

  native-reference:
    name: Independent LevelDB and NBT references
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install locked test environment and independent references
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/leveldb-reference.lock -r requirements/nbt-reference.lock
      - name: Verify all locks including reference wheels
        run: python scripts/compile_lockfiles.py --check --include-references
      - name: Audit independent references
        run: python scripts/security_check.py --require-pip-audit --requirements requirements/leveldb-reference.txt --requirements requirements/nbt-reference.txt
      - name: Full suite with mandatory loadable references
        run: python scripts/test_full.py --require-references -v

  posix-reference:
    # The reference engine publishes no Linux wheels. Its macOS wheel lets the
    # POSIX fcntl lock and recovery run against a native engine without a compiler.
    name: POSIX LevelDB reference (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install locked test environment and LevelDB reference
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/leveldb-reference.lock
      - name: LevelDB suites with a mandatory reference engine
        run: |
          python -c "import leveldb; assert callable(leveldb.LevelDB)"
          python -m pytest tests/test_leveldb_writer.py tests/test_leveldb_readonly.py tests/test_leveldb_portability.py tests/test_readonly_format_regressions.py -q

  windows-setup:
    name: Runtime ZIP setup (Python ${{ matrix.python }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create and extract runtime ZIP
        run: |
          python scripts/make_release_zip.py --output .tmp/runtime.zip
          python -m zipfile -e .tmp/runtime.zip .tmp/runtime-package
      - name: Install extracted runtime in a fresh environment
        working-directory: .tmp/runtime-package/mcbe_inventory_editor
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe scripts/windows_setup.py install
          .venv/Scripts/python.exe -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('leveldb', 'amulet_nbt', 'numpy', 'Cython'))"
          .venv/Scripts/python.exe -c "import main; from mcbe_editor.distribution import distribution_snapshot; assert distribution_snapshot()['kind'] == 'release'; assert main.app.test_client().get('/healthz').status_code == 200"

  package:
    name: Runtime package check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, integrity, tests, browser-smoke, native-reference, posix-reference, windows-setup]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${project_version}" = "${GITHUB_REF_NAME}"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements/dev.lock
      - name: Build and validate runtime source archive
        run: |
          python scripts/make_release_zip.py --output dist/mcbe_inventory_editor_${GITHUB_SHA}_runtime.zip
          python scripts/release_check.py --archive dist/mcbe_inventory_editor_${GITHUB_SHA}_runtime.zip
      - name: Upload runtime source archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcbe-inventory-editor-runtime-${{ github.sha }}
          path: dist/mcbe_inventory_editor_${{ github.sha }}_runtime.zip

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, integrity, tests, browser-smoke, native-reference, posix-reference, windows-setup]
    # Pull Requests, main, Zeitplan und manuelle Läufe validieren das Image.
    # Tag-Pushes bauen im docker-publish-Job, damit kein doppelter Build entsteht.
    if: >-
      !(github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Docker dependency audit target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dependency-audit
          push: false
          load: false
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker
      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mcbe-inventory-editor:smoke
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker

      - name: Verify read-only container startup and shutdown
        timeout-minutes: 4
        run: bash scripts/docker/smoke_image.sh mcbe-inventory-editor:smoke

  docker-publish:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: [package]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Docker dependency audit target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dependency-audit
          push: false
          load: false
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker
      - name: Build runtime image for startup validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mcbe-inventory-editor:smoke
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker
      - name: Verify read-only container startup and shutdown
        timeout-minutes: 4
        run: bash scripts/docker/smoke_image.sh mcbe-inventory-editor:smoke
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve Docker release channel
        id: release_channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/dadeeen/mcbe-inventory-editor
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.release_channel.outputs.publish_latest }}
            type=sha,prefix=sha-
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
      - name: Publish runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [package, docker-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download validated runtime source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcbe-inventory-editor-runtime-${{ github.sha }}
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          source_name="mcbe_inventory_editor_${GITHUB_SHA}_runtime.zip"
          release_name="mcbe_inventory_editor_${GITHUB_REF_NAME}_runtime.zip"
          release_flags=()
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          mv -- "$source_name" "$release_name"
          sha256sum "$release_name" > "${release_name}.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "$release_name" \
            "${release_name}.sha256" \
            --verify-tag \
            --title "MCBE Inventory Editor ${GITHUB_REF_NAME}" \
            --notes-file "${GITHUB_WORKSPACE}/.github/release_notes.md" \
            "${release_flags[@]}"
