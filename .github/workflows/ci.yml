name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-Privilege: packages:write bekommt nur der docker-publish-Job.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build-constraints.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --require-hashes -r requirements/dev.lock
      - name: Ruff lint
        run: ruff check .

  typecheck:
    name: Typed core check
    runs-on: ubuntu-latest
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build-constraints.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --require-hashes -r requirements/dev.lock
      - name: Mypy typed core
        run: python -m mypy

  quality-advisory:
    name: Advisory quality checks
    runs-on: ubuntu-latest
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build-constraints.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --require-hashes -r requirements/dev.lock
      - name: Ruff format advisory
        run: |
          set +e
          output="$(ruff format --check . 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            count="$(printf '%s\n' "$output" | grep -c '^Would reformat:' || true)"
            echo "::warning title=Ruff format advisory::${count} file(s) would be reformatted. This is advisory and does not block CI."
          fi
          exit 0

  integrity:
    name: Dependency and lockfile integrity
    runs-on: ubuntu-latest
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build-constraints.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --require-hashes -r requirements/dev.lock
      - name: Python dependency integrity
        run: python -m pip check
      - name: Validate hash-locked dependency files
        run: |
          python scripts/compile_lockfiles.py --check
          python scripts/check_lockfiles.py
      - name: Dependency audit
        run: python scripts/security_check.py --require-pip-audit

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build-constraints.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --require-hashes -r requirements/dev.lock
      - name: Smoke checks
        run: MCBE_SMOKE_IMPORT_APP=true python scripts/smoke_check.py
      - name: Tests
        run: python scripts/test_full.py -v
      - name: Backend branch coverage
        run: python scripts/coverage_check.py -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore

  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build-constraints.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --require-hashes -r requirements/dev.lock
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser

  package:
    name: Runtime package check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, integrity, tests, browser-smoke]
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements/build-constraints.txt
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${project_version}" = "${GITHUB_REF_NAME}"
      - name: Install dev dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --require-hashes -r requirements/dev.lock
      - name: Build and validate runtime source archive
        run: |
          python scripts/make_release_zip.py --output dist/mcbe_inventory_editor_${GITHUB_SHA}_runtime.zip
          python scripts/release_check.py --archive dist/mcbe_inventory_editor_${GITHUB_SHA}_runtime.zip
      - name: Upload runtime source archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcbe-inventory-editor-runtime-${{ github.sha }}
          path: dist/mcbe_inventory_editor_${{ github.sha }}_runtime.zip

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, integrity, tests, browser-smoke]
    # Pull Requests, main, Zeitplan und manuelle Läufe validieren das Image.
    # Tag-Pushes bauen im docker-publish-Job, damit kein doppelter Build entsteht.
    if: >-
      !(github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Docker dependency audit target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dependency-audit
          push: false
          load: false
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker
      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker

  docker-publish:
    name: Docker publish
    runs-on: ubuntu-latest
    needs: [package]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Docker dependency audit target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dependency-audit
          push: false
          load: false
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve Docker release channel
        id: release_channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/dadeeen/mcbe-inventory-editor
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.release_channel.outputs.publish_latest }}
            type=sha,prefix=sha-
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
      - name: Publish runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcbe-docker
          cache-to: type=gha,mode=max,scope=mcbe-docker

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [package, docker-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated runtime source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcbe-inventory-editor-runtime-${{ github.sha }}
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          source_name="mcbe_inventory_editor_${GITHUB_SHA}_runtime.zip"
          release_name="mcbe_inventory_editor_${GITHUB_REF_NAME}_runtime.zip"
          release_flags=()
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          mv -- "$source_name" "$release_name"
          sha256sum "$release_name" > "${release_name}.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "$release_name" \
            "${release_name}.sha256" \
            --verify-tag \
            --title "MCBE Inventory Editor ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${release_flags[@]}"
