[project]
name = "mcbe-inventory-editor"
version = "0.5.12"
description = "Local Minecraft Bedrock inventory editor with isolated DB, NBT, backup, and UI layers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.3",
    "amulet-nbt==2.1.8",
    "amulet-leveldb==1.0.6",
    "colorama==0.4.6",
]

[project.optional-dependencies]
docker = [
    "gunicorn==26.0.0",
]
dev = [
    "pytest>=9,<10",
    "coverage>=7,<8",
    "ruff>=0.15,<0.16",
    "mypy>=1.20,<2",
    "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "private_world: optional integration tests against local private Bedrock worlds under fixtures/private",
    "destructive: tests that write only to temporary copies of private worlds",
    "slow: tests that can take noticeably longer than the normal unit suite",
]

[tool.ruff]
target-version = "py312"
line-length = 160
exclude = [".venv", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "SIM", "B"]
ignore = ["N806", "N802", "N803", "N815"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["I001"]
"tests/*" = ["N", "E402", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = [
    "mcbe_editor/api_errors.py",
    "mcbe_editor/bedrock_nbt.py",
    "mcbe_editor/deployment.py",
    "mcbe_editor/http_response_handlers.py",
    "mcbe_editor/i18n.py",
    "mcbe_editor/item_db_verification.py",
    "mcbe_editor/mount_placement.py",
    "mcbe_editor/mount_profile.py",
    "mcbe_editor/runtime_data.py",
    "mcbe_editor/service_errors.py",
    "mcbe_editor/setup_state.py",
    "mcbe_editor/world_locks.py",
]
strict = true
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true
warn_unreachable = true
pretty = true

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 75
precision = 1
show_missing = false
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
